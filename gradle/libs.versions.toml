androidx-navigation = "2.8.0"
androidx-material3 = "1.2.0"
androidx-compose = "1.6.7"
androidx-datastore = "1.1.1"
kotlin = "1.9.22"
ktor = "2.3.8"
koin-android = "3.5.3"
koin-androidx-compose = "3.5.3"
coil3 = "3.0.0-alpha06"
coroutines = "1.8.0"
kotlinx-serialization = "1.6.2"

[libraries]
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin-android" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin-androidx-compose" }
